site_name: Graph-Enhanced DBRD
site_description: >-
  A semi-supervised duplicate bug report detector that puts every report, labelled or not, into one
  title-similarity graph and lets a GCN carry supervision to the unlabelled rest. Bilkent CS 588 term project,
  Fall 2025–26.
site_url: https://hkaraca.com/graph-enhanced-dbd/
repo_url: https://github.com/huseyin-karaca/graph-enhanced-dbd
repo_name: huseyin-karaca/graph-enhanced-dbd
copyright: Report and figures © 2026 the authors · code under the repository's licence
theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.svg         # tab icons: bin/make_icons.py in the hkaraca.com repo
  favicon: assets/favicon.svg
  font: false                      # Schibsted Grotesk and JetBrains Mono come from docs/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.footer
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
extra:
  social:
    - icon: fontawesome/solid/house
      link: https://hkaraca.com/
      name: Hüseyin Karaca
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs/snippets]      # figures and tables written by tools/site_figures.py
      check_paths: true
exclude_docs: |
  snippets/
